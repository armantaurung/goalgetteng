<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoalGetteng 🎯</title>
  <meta name="description" content="Aplikasi web pelacak Goal Utama, Sub-Goal, dan Habit Harian dengan visualisasi Pohon Jeruk, Kalender 365 Hari, Integrasi Google Calendar, dan Cloud Sync HP-Laptop." />
  <meta name="theme-color" content="#0f172a" />
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Lucide Icons & Canvas Confetti -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Collapsible Modern Glassmorphism Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-glass);">
        <div class="logo-container" style="display: flex; align-items: center; flex-direction: row; gap: 10px;">
          <span class="logo-icon" style="font-size: 1.6rem; line-height: 1; display: inline-block;">🎯</span>
          <span class="brand-name" style="font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; line-height: 1;">GoalGetteng</span>
        </div>
        <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" title="Perkecil / Perbesar Sidebar">
          <i data-lucide="chevron-left" id="sidebar-toggle-icon"></i>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Dynamic Nav Links rendered by JS -->
      </nav>

      <div class="sidebar-footer">
        <div class="quick-stats-box">
          <div class="stat-title">Habit Hari Ini</div>
          <div class="stat-value" id="quick-stats-val">0/0</div>
        </div>
      </div>
    </aside>

    <!-- Main View Content Area -->
    <main class="main-content">
      <!-- Top Utility Header with Cloud Sync Status -->
      <div style="display: flex; justify-content: flex-end; margin-bottom: 12px;">
        <button class="btn btn-secondary" id="btn-open-cloud-sync" style="padding: 6px 14px; font-size: 0.82rem; border-color: rgba(56, 189, 248, 0.4); color: #38bdf8;">
          <i data-lucide="cloud-lightning"></i> <span id="cloud-sync-status-text">☁️ Cloud Sync (HP ↔ Laptop)</span>
        </button>
      </div>

      <div id="view-content">
        <!-- Dynamic View Content rendered by JS -->
      </div>
    </main>
  </div>

  <!-- Reusable Glassmorphism Modal Backdrop -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-card" id="modal-card-content">
      <!-- Dynamic Modal Form Content -->
    </div>
  </div>

  <!-- Application Bundle -->
  <script src="app.js"></script>
</body>
</html>
